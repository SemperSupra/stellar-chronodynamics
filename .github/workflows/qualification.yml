name: bounded-synthetic-bakeoff
on:
  push:
    branches: [main]
    paths: ['go.mod', 'cmd/**', 'fixtures/**', '.github/workflows/qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-bakeoff
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Go tests/race/vet
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Synthetic-only experiment
        run: |
          go run ./cmd/bakeoff -input fixtures/three_systems.json -out .local/experiment
          test -s .local/experiment/result.json
          test -s .local/experiment/summary.md
      - name: Evidence upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: synthetic-evidence
          path: .local/experiment
          if-no-files-found: error
          retention-days: 7
