name: bounded-synthetic-bakeoff
on:
  push:
    branches: [main]
    paths: ['go.mod', 'cmd/**', 'fixtures/**', '.github/workflows/qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-bakeoff
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Go tests/race/vet
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Synthetic-only experiment
        run: |
          go run ./cmd/bakeoff -input fixtures/three_systems.json -out .local/experiment
          test -s .local/experiment/result.json
          test -s .local/experiment/summary.md
      - name: Evidence upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-evidence
          path: .local/experiment
          if-no-files-found: error
          retention-days: 7
